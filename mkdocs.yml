site_name: landschaft
site_url: https://landschaft.fancysnake.dev
site_description: Local kanban dashboards over GitHub issues — swimlanes × columns from labels.
repo_url: https://github.com/fancysnake/landschaft
repo_name: fancysnake/landschaft
copyright: MIT

# A link to a page that is not there is what rots first when a page is
# renamed, and from here it fails `site:dev` as well as `site:build`.
strict: true

# Under strict a warning is a failure; anchors are how cross-references
# between pages actually break, and MkDocs only logs them at info.
validation:
  anchors: warn

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  font:
    text: Nunito
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: forest
      toggle: { icon: material/weather-sunset-down, name: Dusk over the valley }
    - media: "(prefers-color-scheme: dark)"
      scheme: forest-night
      toggle: { icon: material/weather-sunset-up, name: Dawn over the valley }
  features:
    - content.code.copy
    - navigation.top
    - navigation.footer

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fancysnake/landschaft
    - icon: fontawesome/solid/globe
      link: https://fancysnake.dev
      name: fancysnake.dev

extra_css:
  - stylesheets/forest.css

markdown_extensions:
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences
  # Shared prose lives in README.md and is included from there, so the two
  # cannot drift. base_path is the repo root, which is where mkdocs runs.
  - pymdownx.snippets: { base_path: ["."], check_paths: true }

nav:
  - index.md
  - getting-started.md
  - configuration.md
  - board.md
  - api.md
  - architecture.md
  - changelog.md
