# What `vekna cast <ritual>` runs here: cabinet's pull request maintenance
# rituals (refresh, review, labels), read from the `[cabinet]` section.
[rituals]
modules = ["cabinet.rituals.refresh", "cabinet.rituals.review", "cabinet.rituals.labels"]

[cabinet]
remote = "https-origin"
gate = "mise run fullcheck"

[cabinet.agent]
may_run = [
  "mise run fullcheck",
  "mise run test",
  "mise run check",
  "mise run lint",
  "mise run format",
]
